<body>
    <script>
        function saludo(nombre,apellido,genero,evento,minutosQueFaltan){
            if(genero != "MASCULINO" || genero != "FEMENINO"){
                if(minutosQueFaltan<60*24){
                    var momento = "hoy";
                }else if(minutosQueFaltan<60*24*2){
                    var momento = "mañana";
                }else{
                    var momento = "pronto";
                }

                if(genero == "MASCULINO"){
                    var tipoSaludo = "Bienvenido ";
                }else{
                    var tipoSaludo = "Bienvenida ";
                }
                return tipoSaludo+nombre.trim().toUpperCase()+" "+apellido.trim().toUpperCase()+", recuerda "+momento+" el evento ("+evento+")";
            }else{
                return "Error el genero que ingreso no es valido"
            }
        }

        console.log(saludo("    LUIS", "perez", "MASCULINO", "Película", 600));
        console.log(saludo("ana ", "peRez", "FEMENINO", "Comidas del Mundo", 1500));
        console.log(saludo("  PEDRO ", "Gil", "MASCULINO", "Juego de Baloncesto", 5000));
    </script>
</body>
