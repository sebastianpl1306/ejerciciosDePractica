<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viajar a NY</title>
</head>
<body>
    <!--Este es el titulo solo debe ser usada 1 vez la etiqueta h1-->
    <h1>Viajar a NY</h1>
    <!--Esta es una imagen alt muestra un mensaje en caso de que no cargue, title muestra un mensaje al pasar por encima, width me espesifica el ancho y height el largo-->
    <img src="images/imagen1.jpg" alt="imagen de NewYork" title="NewYork" width="500" height="300">
    <!--La etiqueta parrafo nos permite contener texto-->
    <p>Aqui conseguirás información para planificar tu viaje a NY</p>

    <!--La etiqueta h2 nos sirve para crear subtitulos-->
    <h2>Recordatorios</h2>
    <!--Esta es una lista desordenada-->
    <ul>
        <li>Comprar tarjeta de metro</li>
        <li>Alquilar un Hotel</li>
        <li>Crear la lista de lugares para visitar</li>
        <li>Crear la lista de lugares para comer</li>
    </ul>

    <h2>Costos</h2>
    <!--Esta es una tabla-->
    <table>
        <!--la etiqueta thead nos permite saber cual es el encabezado de la tabla-->
        <thead>
        <tr>
            <th>Descripción</th>
            <th>Costo</th>
        </tr>
        </thead>

        <!--La etiqueta tbody nos permite saber el cuerpo de la tabla-->
        <tbody>
        <tr>
            <td>Transporte</td>
            <td>100</td>
        </tr>
        <tr>
            <td>Hotel</td>
            <td>500</td>
        </tr>
        <tr>
            <td>Comida</td>
            <td>150</td>
        </tr>
        </tbody>

        <!--la estiqueta tfoot nos permite saber el final de las tablas-->
        <tfoot>
        <tr>
            <th>Total</th>
            <th>750</th>
        </tr>
        </tfoot>
    </table>
</body>
</html>
