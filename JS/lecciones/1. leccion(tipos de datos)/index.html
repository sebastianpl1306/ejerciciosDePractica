<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        /*Esta es una variable de tipo entero*/
        var edad = 15;
        console.log(edad);
        /*Esta es una variable de tipo flotante o decimal*/
        var distancia = 1.5;
        console.log(distancia);
        /*Esta es de tipo string y debe siempre ir en comillas ya sean simples "" o dobles ''*/
        var nombre = "sebastian";
        console.log(nombre);

        /*Esta es una variable de tipo arreglo y para llamarlas escribimos el nombre y la posicion del dato*/
        var colores = ["rojo","blanco","azul"];
        console.log(colores[0]);

        /*Variable de tipo objeto*/
        var persona = {"altura": 160, colorDeOjos: "café"};
        console.log(persona.colorDeOjos);

        /*Esta variable es de tipo boleana y solo admite un valor true o false*/
        var estaActivo = false;
        console.log(estaActivo);

        /*Operaciónes con variables*/
        var numero1 = 4;
        var numero2 = 6;

        var resultado = numero1 + numero2;
        console.log(resultado);

        /*operaciones con strings*/
        var nombreYEdad = "nombre: " + nombre + ", Edad: " + edad;
        console.log(nombreYEdad);
    </script>
</body>
</html>
