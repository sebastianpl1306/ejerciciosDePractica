        /*Esta funcion me detecta el numero mas pequeño de un arreglo*/
        function buscarValorMin(valorMin){
            var min = valorMin[0];
            for(var i in valorMin){
                if(valorMin[i]<min){
                    min = valorMin[i];
                }else{

        }

        /*Esta funcion me detecta el numero mas grande de un arreglo*/
        function buscarValorMax(valorMax){
            var max = valorMax[0];
            for(var i in valorMax){
                if(valorMax[i]>max){

                }else{

            }

        /*Esta funcion me calcula el promedio*/
        function calculoPromedio(numerosPromedio,numeroMin,numeroMax){
            var cont = 0;
            var total = 0;
            for(var i in numerosPromedio){
                total+=numerosPromedio[i];
                cont++;
            }
            total -= (numeroMax-numeroMin);
            return total/(cont-2);
        }
